<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Bancario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        h1 { color: #333; }
        .nav { margin-bottom: 20px; }
        .nav button { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        form { display: flex; flex-direction: column; max-width: 400px; gap: 10px; }
        input, button { padding: 8px; }
        .btn-submit { background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gestión Bancaria</h1>
    
    <div class="nav">
        <button onclick="showTab('clientes')">1. Consultar Clientes</button>
        <button onclick="showTab('transferir')">2. Transferir Dinero</button>
        <button onclick="showTab('historico')">3. Histórico de Transacciones</button>
    </div>

    <!-- Vista 1: Clientes -->
    <div id="clientes" class="tab-content active">
        <h2>Lista de Clientes</h2>
        <button onclick="cargarClientes()">Cargar / Actualizar Clientes</button>
        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>N° Cuenta</th><th>Saldo</th></tr>
            </thead>
            <tbody id="tabla-clientes"></tbody>
        </table>
    </div>

    <!-- Vista 2: Transferencia -->
    <div id="transferir" class="tab-content">
        <h2>Realizar Transferencia</h2>
        <form id="form-transferencia">
            <label>Cuenta Origen:</label>
            <input type="text" id="sender" required>
            <label>Cuenta Destino:</label>
            <input type="text" id="receiver" required>
            <label>Monto:</label>
            <input type="number" step="0.01" id="amount" required>
            <button type="submit" class="btn-submit">Realizar Transferencia</button>
        </form>
        <p id="msg-transferencia"></p>
    </div>

    <!-- Vista 3: Histórico -->
    <div id="historico" class="tab-content">
        <h2>Histórico por Cuenta</h2>
        <input type="text" id="search-account" placeholder="Ingrese número de cuenta">
        <button onclick="cargarHistorico()">Buscar Transacciones</button>
        <table>
            <thead>
                <tr><th>ID</th><th>Origen</th><th>Destino</th><th>Monto</th><th>Fecha/Hora</th></tr>
            </thead>
            <tbody id="tabla-historico"></tbody>
        </table>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        async function cargarClientes() {
            try {
                const res = await fetch('/api/customers');
                const data = await res.json();
                const tbody = document.getElementById('tabla-clientes');
                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.firstName}</td>
                        <td>${c.lastName}</td>
                        <td>${c.accountNumber}</td>
                        <td>$${c.balance}</td>
                    </tr>
                `).join('');
            } catch (e) { alert('Error al cargar clientes'); }
        }

        document.getElementById('form-transferencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                senderAccountNumber: document.getElementById('sender').value,
                receiverAccountNumber: document.getElementById('receiver').value,
                amount: parseFloat(document.getElementById('amount').value)
            };
            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const msg = document.getElementById('msg-transferencia');
                if(res.ok) {
                    msg.style.color = 'green';
                    msg.innerText = '¡Transferencia exitosa!';
                    document.getElementById('form-transferencia').reset();
                } else {
                    msg.style.color = 'red';
                    msg.innerText = 'Error en la transferencia';
                }
            } catch (e) { alert('Error de conexión'); }
        });

        async function cargarHistorico() {
            const acc = document.getElementById('search-account').value;
            if(!acc) return alert('Ingrese un número de cuenta');
            try {
                const res = await fetch(`/api/transactions/${acc}`);
                const data = await res.json();
                const tbody = document.getElementById('tabla-historico');
                tbody.innerHTML = data.map(t => `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.senderAccountNumber}</td>
                        <td>${t.receiverAccountNumber}</td>
                        <td>$${t.amount}</td>
                        <td>${t.timestamp || 'N/A'}</td>
                    </tr>
                `).join('');
            } catch (e) { alert('Error al cargar transacciones'); }
        }

        // Cargar clientes al iniciar
        cargarClientes();
    </script>
</body>
</html>
