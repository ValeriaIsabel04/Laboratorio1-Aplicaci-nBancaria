<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Bancaria</title>
    <!-- Iconos de FontAwesome para mejorar la interfaz -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary-color: #0d9488;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header { background-color: var(--primary-color); color: white; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }

        /* Layout */
        .container { max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1rem; flex-grow: 1; }
        
        /* Navegación por Pestañas */
        .nav-tabs { display: flex; gap: 0.5rem; border-bottom: 2px solid var(--border-color); margin-bottom: 1.5rem; }
        .tab-btn { background: none; border: none; padding: 0.75rem 1.25rem; font-size: 1rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .tab-btn:hover { color: var(--primary-color); }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

        /* Contenido de Pestañas */
        .tab-content { display: none; background: var(--surface-color); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        /* Cabeceras de Sección */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem; }
        .section-header h2 { font-size: 1.25rem; color: var(--primary-color); }

        /* Botones */
        .btn { padding: 0.6rem 1rem; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: background-color 0.2s; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-secondary { background-color: var(--text-muted); color: white; }
        .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.875rem; }

        /* Tablas */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 0.85rem; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        tr:hover { background-color: #f8fafc; }
        .actions-cell { display: flex; gap: 0.5rem; }

        /* Formularios */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .form-group label { font-size: 0.875rem; font-weight: 600; color: var(--text-color); }
        .form-group input { padding: 0.6rem; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 1rem; }
        .form-group input:focus { outline: 2px solid var(--primary-color); border-color: transparent; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; animation: fadeIn 0.2s ease-in-out; }
        .modal-content { background: white; padding: 1.5rem; border-radius: var(--radius); width: 100%; max-width: 500px; box-shadow: var(--shadow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; }

        /* Mensajes y Notificaciones */
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: var(--radius); color: white; font-weight: 600; box-shadow: var(--shadow); display: none; z-index: 1100; }
        .toast.success { background-color: var(--success-color); }
        .toast.error { background-color: var(--danger-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-building-columns"></i> Banco Personal</h1>
        <span id="system-status"><i class="fa-solid fa-circle" style="color: #10b981; font-size: 0.75rem;"></i> Sistema Operativo</span>
    </header>

    <div class="container">
        <!-- Navegación -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab(event,'clientes')"><i class="fa-solid fa-users"></i> Clientes </button>
            <button class="tab-btn" onclick="showTab(event,'transferir')"><i class="fa-solid fa-money-bill-transfer"></i> Transferencias</button>
            <button class="tab-btn" onclick="showTab(event,'historico')"><i class="fa-solid fa-clock-rotate-left"></i> Historial</button>
        </div>

        <!-- Vista 1: Clientes (CRUD Completo) -->
        <div id="clientes" class="tab-content active">
            <div class="section-header">
                <h2>Gestión de Clientes</h2>
                <div>
                   
                    <button class="btn btn-primary btn-sm" onclick="abrirModalCrear()"><i class="fa-solid fa-user-plus"></i> Nuevo Cliente</button>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>N° Cuenta</th>
                            <th>Saldo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes"></tbody>
                </table>
            </div>
        </div>

        <!-- Vista 2: Transferencia -->
        <div id="transferir" class="tab-content">
            <div class="section-header">
                <h2>Realizar Transferencia Bancaria</h2>
            </div>
            <form id="form-transferencia" style="max-width: 500px;">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="sender">Cuenta Origen</label>
                    <input type="text" id="sender" placeholder="Ej: 1001" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="receiver">Cuenta Destino</label>
                    <input type="text" id="receiver" placeholder="Ej: 1002" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="amount">Monto ($)</label>
                    <input type="number" step="0.01" id="amount" min="0.01" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-paper-plane"></i> Procesar Transferencia</button>
            </form>
        </div>

        <!-- Vista 3: Histórico -->
        <div id="historico" class="tab-content">
            <div class="section-header">
                <h2>Histórico de Transacciones</h2>
            </div>
            <div style="display: flex; gap: 0.5rem; max-width: 400px; margin-bottom: 1.5rem;">
                <input type="text" id="search-account" class="form-group" style="flex-grow: 1; padding: 0.6rem;" placeholder="N° de Cuenta">
                <button class="btn btn-primary" onclick="cargarHistorico()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Transacción</th>
                            <th>Cuenta Origen</th>
                            <th>Cuenta Destino</th>
                            <th>Monto</th>
                            <th>Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historico"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Formulario Cliente (Crear / Editar) -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nuevo Cliente</h3>
                <button onclick="cerrarModal()" style="background:none; border:none; cursor:pointer; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-cliente" onsubmit="guardarCliente(event)">
                <input type="hidden" id="cliente-id">
                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label for="accountNumber">Número de Cuenta</label>
                    <input type="text" id="accountNumber" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="balance">Saldo Inicial ($)</label>
                    <input type="number" step="0.01" id="balance" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // Manejo de Navegación por pestañas
        // Manejo de Navegación por pestañas
       function showTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
       }

        // Sistema de Notificaciones Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // --- FUNCIONALIDADES CRUD CLIENTES ---

        // 1. LEER (READ)
        async function cargarClientes() {
            try {
                const res = await fetch('/api/customers');
                if(!res.ok) throw new Error('Error en la respuesta del servidor');
                const data = await res.json();
                
                const tbody = document.getElementById('tabla-clientes');
                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.firstName}</td>
                        <td>${c.lastName}</td>
                        <td><strong>${c.accountNumber}</strong></td>
                        <td>$${parseFloat(c.balance).toFixed(2)}</td>
                        <td class="actions-cell">
                            <button class="btn btn-primary btn-sm" onclick="abrirModalEditar(${c.id}, '${c.firstName}', '${c.lastName}', '${c.accountNumber}', ${c.balance})">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarCliente(${c.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { 
                showToast('Error al cargar la lista de clientes', 'error'); 
            }
        }

        // Modal Helpers
        function abrirModalCrear() {
            document.getElementById('modal-title').innerText = 'Nuevo Cliente';
            document.getElementById('form-cliente').reset();
            document.getElementById('cliente-id').value = '';
            document.getElementById('accountNumber').disabled = false;
            document.getElementById('modal-cliente').classList.add('active');
        }

        function abrirModalEditar(id, firstName, lastName, accountNumber, balance) {
            document.getElementById('modal-title').innerText = 'Editar Cliente';
            document.getElementById('cliente-id').value = id;
            document.getElementById('firstName').value = firstName;
            document.getElementById('lastName').value = lastName;
            document.getElementById('accountNumber').value = accountNumber;
            document.getElementById('accountNumber').disabled = true; // No editar la cuenta directamente
            document.getElementById('balance').value = balance;
            document.getElementById('modal-cliente').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal-cliente').classList.remove('active');
        }

        // 2. CREAR Y EDITAR (CREATE / UPDATE)
        async function guardarCliente(e) {
            e.preventDefault();
            const id = document.getElementById('cliente-id').value;
            const clienteData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                accountNumber: document.getElementById('accountNumber').value,
                balance: parseFloat(document.getElementById('balance').value)
            };

            const isEdit = id !== '';
            const url = isEdit ? `/api/customers/${id}` : '/api/customers';
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clienteData)
                });

                if (res.ok) {
                    showToast(isEdit ? 'Cliente actualizado con éxito' : 'Cliente creado con éxito');
                    cerrarModal();
                    cargarClientes();
                } else {
                    showToast('Error al guardar los datos del cliente', 'error');
                }
            } catch (e) {
                showToast('Error de conexión con el servidor', 'error');
            }
        }

        // 3. ELIMINAR (DELETE)
        async function eliminarCliente(id) {
            if (!confirm('¿Está seguro de que desea eliminar este cliente?')) return;

            try {
                const res = await fetch(`/api/customers/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Cliente eliminado correctamente');
                    cargarClientes();
                } else {
                    showToast('No se pudo eliminar el cliente', 'error');
                }
            } catch (e) {
                showToast('Error de conexión con el servidor', 'error');
            }
        }

        // --- TRANSACCIONES ---

        document.getElementById('form-transferencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                senderAccountNumber: document.getElementById('sender').value,
                receiverAccountNumber: document.getElementById('receiver').value,
                amount: parseFloat(document.getElementById('amount').value)
            };

            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    showToast('¡Transferencia realizada con éxito!');
                    document.getElementById('form-transferencia').reset();
                    cargarClientes(); // Actualizar saldos
                } else {
                    showToast('Error: Verifique las cuentas y el saldo disponible', 'error');
                }
            } catch (e) { 
                showToast('Error de conexión al procesar la transferencia', 'error'); 
            }
        });

        // --- HISTÓRICO DE TRANSACCIONES ---

        async function cargarHistorico() {
            const acc = document.getElementById('search-account').value;
            if(!acc) return showToast('Ingrese un número de cuenta', 'error');
            
            try {
                const res = await fetch(`/api/transactions/${acc}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                const tbody = document.getElementById('tabla-historico');
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No se encontraron transacciones.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(t => `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.senderAccountNumber}</td>
                        <td>${t.receiverAccountNumber}</td>
                        <td><strong>$${parseFloat(t.amount).toFixed(2)}</strong></td>
                        <td>${t.timestamp ? new Date(t.timestamp).toLocaleString() : 'N/A'}</td>
                    </tr>
                `).join('');
            } catch (e) { 
                showToast('Error al buscar el historial de la cuenta', 'error'); 
            }
        }

        // Inicialización
        cargarClientes();
    </script>
</body>
</html>
